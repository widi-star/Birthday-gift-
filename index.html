<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sayang</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#C7C6C1;
    padding:20px;
    overflow:hidden;
}

/* CARD */

.card{
    width:100%;
    max-width:360px;
    background:#f8f8f8;
    border-radius:38px;
    padding:28px 24px;
    text-align:center;
    box-shadow:
    0 10px 30px rgba(0,0,0,0.08),
    0 4px 10px rgba(0,0,0,0.04);

    animation:fadeIn 1.2s ease;
}

/* IMAGE */
/* TEXT */

.title{
    font-size:28px;
    line-height:1.35;
    font-weight:700;
    color:#222;
    margin-bottom:12px;
}

.subtitle{
    font-size:16px;
    color:#666;
    font-style:italic;
    margin-bottom:28px;
}

/* BUTTON */

.btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:190px;
    height:54px;
    background:#bdbdbd;
    border-radius:999px;
    text-decoration:none;
    color:#333;
    font-size:17px;
    font-weight:600;
    transition:0.3s ease;
    box-shadow:0 6px 18px rgba(150,150,150,0.35);
}

.btn:hover{
    transform:translateY(-3px) scale(1.03);
    background:#9e9e9e;
}

/* RESPONSIVE */

@media (max-width:480px){

    .card{
        border-radius:30px;
        padding:24px 20px;
    }

    .title{
        font-size:22px;
    }

    .subtitle{
        font-size:15px;
    }

    .btn{
        width:170px;
        height:50px;
        font-size:15px;
    }
}

/* ANIMATION */

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

</style>
</head>

<body>

<div class="card">

    <!-- GANTI FOTO -->
    <img src="blushcat.gif" alt="photo" class="profile">

    <div class="title">
        you deserve all the love in the world today and always.
    </div>

    <div class="subtitle">
        
    </div>

    <!-- GANTI LINK -->
    <a href="../Halaman4/Index.html" class="btn">
        click♡
    </a>

</div>

</body>
</html>
